[project]
name = "pascaline"
dynamic = ["version"]
description = "A notebook-style scientific calculator for the terminal, made for Omarchy."
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
    "sympy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
pascaline = "pascaline.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "pascaline.__version__"}

[tool.setuptools.package-data]
pascaline = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
